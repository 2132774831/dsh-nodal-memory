<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>本地记忆</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%234a90d9'/></svg>" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <strong>本地记忆</strong>
      <span class="hint" id="appMeta">连接中…</span>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab tab--on" data-tab="graph">关系图</button>
      <button class="tab" data-tab="list">记忆列表</button>
      <button class="tab" data-tab="classify">补标</button>
      <button class="tab" data-tab="insight">直觉</button>
      <button class="tab" data-tab="settings">设置</button>
    </nav>
  </header>

  <div id="offlineBar" class="offline" hidden>
    连不上本地服务 —— 那个命令行窗口可能已经关了。<span class="hint">重新双击「启动记忆软件.cmd」，然后刷新本页。</span>
  </div>

  <main id="view" class="view"></main>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
